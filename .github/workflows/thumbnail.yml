name: 예봄교회 유튜브 썸네일 자동화

on:
  schedule:
    # 매주 일요일 13:03 KST = 04:03 UTC
    - cron: "3 4 * * 0"
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    # 사진 선택(최대 2h) + 승인(최대 2h) 폴링을 다 합치면 정상 흐름에서도 4시간을
    # 넘을 수 있어서(2026-08-26 발견: 기존 150분짜리 job timeout이 정상 흐름조차
    # 못 버틸 수 있는 값이었음) 여유 있게 잡는다.
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: 유튜브 쿠키 파일 생성
        # GitHub Actions 공유 IP가 유튜브에 봇으로 차단당해서(yt-dlp도
        # "Sign in to confirm you're not a bot" 에러 남, 2026-08-26 확인)
        # 로그인 쿠키 없이는 영상 다운로드 자체가 안 됨. 사용자의 유튜브
        # 로그인 세션 쿠키를 파일로 복원해서 yt-dlp가 로그인된 것처럼
        # 요청하게 한다.
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          printf '%s' "$YOUTUBE_COOKIES" > youtube_cookies.txt
          echo "쿠키 파일 줄 수: $(wc -l < youtube_cookies.txt)"
          echo "첫 줄: $(head -1 youtube_cookies.txt)"

      - name: 캡처 + 텔레그램 연동 + 썸네일 업로드
        env:
          PYTHONUNBUFFERED: "1"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python capture_live.py
